plugins {
    id 'java'
    alias libs.plugins.shadowJar
    id 'maven-publish'
}

group = 'org.brain4j'

def baseVersion = '3.0.0'
def getCommitHash() {
    try {
        def proc = ['git', 'rev-parse', '--short', 'HEAD'].execute(null, rootDir)
        proc.waitFor()
        if (proc.exitValue() == 0) {
            return proc.text.trim()
        }
        logger.warn("git rev-parse failed: ${proc.err.text.trim()}")
        return "nogit"
    } catch (Exception e) {
        logger.warn("getCommitHash failed: ${e.message}")
        return "nogit"
    }
}

def isSnapshot = "true" == System.getenv("SNAPSHOT")
version = isSnapshot ? "${baseVersion}-${getCommitHash()}-SNAPSHOT" : baseVersion

def javaVersion = 22

subprojects {
    version = rootProject.version
    group = rootProject.group

    apply plugin: 'java'
    apply plugin: 'maven-publish'

    repositories {
        mavenCentral()
        maven {
            name "brain4jReleases"
            url "https://repo.brain4j.org/releases"
        }
        maven {
            name "brain4jSnapshots"
            url "https://repo.brain4j.org/snapshots"
        }
    }

    publishing {
        repositories {
            maven {
                name = "brain4j"

                def releasesRepo = uri("https://repo.brain4j.org/releases")
                def snapshotsRepo = uri("https://repo.brain4j.org/snapshots")

                url = version.endsWith("SNAPSHOT") ? snapshotsRepo : releasesRepo

                credentials {
                    username = findProperty("BRAIN4J_USER") ?: System.getenv("BRAIN4J_USER")
                    password = findProperty("BRAIN4J_PASS") ?: System.getenv("BRAIN4J_PASS")
                }

                authentication {
                    create("basic", BasicAuthentication)
                }
            }
        }
        publications {
            create("gpr", MavenPublication) {
                from components.java
                groupId = project.group
                artifactId = project.name
                version = project.version
            }
        }
    }

    compileJava {
        options.encoding = "UTF-8"
        options.compilerArgs.addAll(["--enable-preview"])
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = javaVersion
        options.compilerArgs.addAll(["--enable-preview"])
    }

    tasks.withType(Test).configureEach {
        jvmArgs("--enable-preview", "--add-modules", "jdk.incubator.vector")
    }

    tasks.withType(Javadoc).configureEach {
        options.source = String.valueOf(javaVersion)
        options.addBooleanOption('-enable-preview', true)
        options.addStringOption('-add-modules', 'jdk.incubator.vector')
    }

    tasks.withType(JavaExec).configureEach {
        jvmArgs("--enable-preview", "--add-modules", "jdk.incubator.vector")
    }
}

gradle.projectsEvaluated {
    subprojects.each { sub ->
        def projectDeps = [] as Set

        try {
            sub.configurations.getByName('compileClasspath').allDependencies.withType(
                org.gradle.api.artifacts.ProjectDependency
            ).each {
                projectDeps << sub.project(it.path)
            }
        } catch (Exception ignored) {
            // configuration not present, nothing to order
        }

        ['compileJava', 'compileTestJava', 'test'].each { taskName ->
            def task = sub.tasks.findByName(taskName)

            if (task != null) {
                projectDeps.each { dep ->
                    def shadow = dep.tasks.findByName('shadowJar')

                    if (shadow != null) {
                        task.mustRunAfter(shadow)
                    }
                }
            }
        }
    }
}

tasks.register('buildAll') {
    dependsOn ':brain4j-datasets:shadowJar',
            ':brain4j-math:shadowJar',
            ':brain4j-core:shadowJar',
            ':brain4j-dashboard:shadowJar'

    doLast {
        println 'Completed build for all modules.'
    }
}

tasks.register('publishAll') {
    dependsOn ':brain4j-datasets:publish',
            ':brain4j-math:publish',
            ':brain4j-core:publish',
            ':brain4j-dashboard:publish'

    doLast {
        println 'Published all modules to the main repository.'
    }
}
