name: Build

on:
  push:
    branches: ["3.0", "main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "22"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build shadow jars
        run: ./gradlew buildAll

      - name: Run tests
        run: ./gradlew test

      - name: Collect artifacts
        run: |
          mkdir -p release
          find brain4j-core brain4j-math brain4j-datasets brain4j-dashboard \
            -path '*/build/libs/*.jar' -type f \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
            -exec cp -v {} release/ \;
          test -n "$(ls -A release)"
          ls -la release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: continuous-build
          path: release/*
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: continuous-build
          path: release

      - name: Create or update continuous release
        uses: ncipollo/release-action@v1
        with:
          tag: continuous
          commit: ${{ github.sha }}
          name: Continuous build
          body: |
            Automatic build from `${{ github.ref_name }}` at `${{ github.sha }}`.

            - Commit: ${{ github.sha }}
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          artifacts: "release/*"
          artifactErrorsFailBuild: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          prerelease: true
          makeLatest: false
